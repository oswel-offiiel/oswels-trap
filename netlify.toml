# =====================================================================
#  Netlify : comment fabriquer le site oswels-trap.netlify.app à partir de ce dépôt.
#  Une fois le site Netlify relié à ce dépôt GitHub, chaque envoi (push) sur « main »
#  met le site à jour tout seul : la page de téléchargement ET le jeu jouable dans
#  le navigateur (jouer/). Détails : site/LISEZMOI.md
# =====================================================================
[build]
  command = "bash site/construire.sh"
  publish = "site/public"

[build.environment]
  NODE_VERSION = "22"
