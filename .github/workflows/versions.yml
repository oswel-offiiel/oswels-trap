# =====================================================================
# OSWEL'S TRAP — fabrication automatique des versions (GitHub Actions)
# À chaque envoi (push) sur GitHub, ou à la main (onglet « Actions » →
# « Fabriquer les versions » → Run workflow), GitHub fabrique :
#   - l'application Android (.apk)            → job « android »
#   - l'installeur Windows (.exe) + le .zip    → job « pc » (windows)
#   - Linux : AppImage, paquet pacman (CachyOS / Arch) et .deb → job « pc » (linux)
# Quand tout est fabriqué, le job « publier » met les fichiers dans une
# « Release » (onglet Releases du dépôt : un fichier par appareil). Son nom
# vient de la version de bureau/package.json (ex. v1.5.0) : pour une nouvelle
# version, change ce numéro avant d'envoyer. Une étiquette v… marche aussi.
# =====================================================================
name: Fabriquer les versions

on:
  push:
    branches: [main, master]
    tags: ['v*']
    # (un changement qui ne touche QUE le site web ne refabrique pas le jeu)
    paths-ignore: ['site/**', 'netlify.toml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Préparer le projet Android
        working-directory: mobile
        run: |
          npm ci
          node ../bureau/preparer.js ../mobile/www
          npx cap sync android
      - name: Fabriquer l'APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../sortie
          cp app/build/outputs/apk/debug/app-debug.apk ../../sortie/Oswels-Trap-1.5.0-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: oswels-trap-android, path: sortie/*.apk }

  pc:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cible: --win nsis zip
          - os: ubuntu-latest
            cible: --linux AppImage pacman deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Fabriquer la version PC
        working-directory: bureau
        shell: bash
        run: |
          npm ci
          node preparer.js
          npx electron-builder ${{ matrix.cible }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: oswels-trap-${{ runner.os }}
          path: |
            bureau/dist/*.exe
            bureau/dist/*.zip
            bureau/dist/*.AppImage
            bureau/dist/*.pacman
            bureau/dist/*.deb

  # Une seule « Release » (la page de téléchargement), créée quand tout est fabriqué :
  # à chaque envoi sur main (version lue dans bureau/package.json, ex. v1.5.0) ou avec une étiquette v…
  publier:
    needs: [android, pc]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Numéro de version
        id: v
        run: echo "tag=v$(node -p "require('./bureau/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: sortie, merge-multiple: true }
      - run: ls -la sortie
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          name: Oswel's Trap ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          body: |
            Oswel's Trap — un fichier par appareil :
            - **Windows** : `…windows-installation.exe` (installeur) ou `…windows-x64.zip` (sans installation)
            - **CachyOS / Arch** : `…linux-x64.pacman` → `sudo pacman -U Oswels-Trap-…-linux-x64.pacman`
            - **Autres Linux** : `…AppImage` (rendre exécutable puis double-clic) ou `…amd64.deb`
            - **Android** : `…android.apk` (autoriser « Installer des applications inconnues »)
            Tout fonctionne hors ligne.
          files: sortie/*
